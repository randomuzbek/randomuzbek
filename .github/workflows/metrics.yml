name: metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/metrics/generate.py", ".github/workflows/metrics.yml"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A PAT that can read private repos. Without it the card would only count
    # public ones, which is the whole problem it exists to fix — so every step
    # below is skipped rather than writing a wrong card.
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.METRICS_TOKEN != ''

      - name: Regenerate metrics.svg
        if: env.METRICS_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/metrics/generate.py

      - name: Commit if changed
        if: env.METRICS_TOKEN != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.svg
          git diff --staged --quiet || git commit -m "metrics: refresh"
          git push
